name: Count Solved Problems

on:
  push:
    branches:
      - main

jobs:
  count:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Count problem files
        run: |
          COUNT=$(find BOJ SWEA -name "*.py" | wc -l)
          echo "Solved Problems: **$COUNT**"
          sed -i "s/Solved Problems:.*/Solved Problems: **$COUNT**/" README.md

      - name: Commit and push if changed
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
          else
            git config --global user.name "github-actions"
            git config --global user.email "actions@github.com"
            git add README.md
            git commit -m "chore: update solved problem count"
            git push
          fi
