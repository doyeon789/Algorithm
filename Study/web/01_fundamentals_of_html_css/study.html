<!-- 해당 문서가 html로 문서라는 것을 나타냄 -->
<!DOCTYPE html>
<!-- 전체 페이지의 콘텐츠를 포함 -->
<html lang="en">


<!-- HTML 문서에 관련된 설명, 설정, 등 컴퓨터가 식별하는 메타 데이터를 작성 -->
<!-- 사용자에게 보이지 않음 -->
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- 제목 -->
  <title>Document</title>
</head>

<!-- HTML 문서의 내요을 나타냄 -->
<!-- 페이지에 표시되는 모든 콘텐츠를 작성 -->
<!-- 한 문서의 하나의 body요소만 존재 -->
<body>
</body>

</html>
